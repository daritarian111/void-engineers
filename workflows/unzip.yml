name: Unpack game zip
on:
  push:
    branches: [main]
    paths: ['index.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -o index.zip
          rm index.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack game zip" || echo "nothing to commit"
          git push
