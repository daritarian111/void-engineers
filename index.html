<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<title>PF2e GM Tool</title>
<style>
:root{--bg:#16130f;--card:#221d17;--card2:#2c261e;--line:#3d3428;--tx:#efe6d6;--mut:#a89c85;--acc:#c9892b;--red:#b5453a;--grn:#5c8a4a;--blu:#4a7aa8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
main{padding:10px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#100e0b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;font-size:13px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 2px 0 var(--acc)}
h2{margin:6px 0 10px;font-size:19px}
h3{margin:12px 0 6px;font-size:15px;color:var(--acc)}
button,select,input,textarea{font:inherit}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:38px}
button.pri{background:var(--acc);color:#1a1209;border-color:var(--acc);font-weight:700}
button.dng{background:var(--red);border-color:var(--red)}
button.sm{padding:4px 8px;min-height:30px;font-size:13px}
input,select,textarea{background:#120f0b;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;width:100%;min-width:0}
textarea{min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:7px 0}
.row.act{box-shadow:0 0 0 3px #efe6d688}
.row.down{opacity:.8}
.row.blk{border-width:3px;border-color:var(--bc,var(--line));box-shadow:inset 0 0 0 3px var(--ic,transparent)}
.row.blk.act{box-shadow:inset 0 0 0 3px var(--ic,transparent),0 0 0 3px #efe6d688}
.row.blk.pcb{--bc:#e0b83a}
.row.blk.pcb.dyingb{background:#4d1410}
.row.down.dyingb{opacity:1}
.row.blk.hp-g{--bc:#4f9a3f}
.row.blk.hp-y{--bc:#e3c53a}
.row.blk.hp-o{--bc:#ee8a2c}
.row.blk.hp-r{--bc:#c4372c}
.chip.ylw{background:#4a4015;border-color:#e3c53a}
.chip.org{background:#4d2a0e;border-color:#ee8a2c}
.glance{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:6px 0 2px;font-size:15px}
.glance .ac{font-size:19px;font-weight:700;color:var(--acc)}
.row .init{width:54px;text-align:center;font-weight:700;font-size:17px;flex:none}
.row .main{flex:1;min-width:0}
.row .btns{display:flex;flex-direction:column;gap:4px;flex:none}
.g{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.bar>*{flex:none}.bar .grow{flex:1;min-width:90px}
.tg{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;min-height:32px;font-size:13px;margin:2px 4px 2px 0}.tg.on{background:var(--acc);color:#1a1209;border-color:var(--acc);font-weight:700}
.chip{display:inline-block;background:#3a2f20;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px;margin:1px 2px 1px 0}
.chip.red{background:#4a2420}.chip.grn{background:#27402a}
.mut{color:var(--mut)}.small{font-size:12px}
.hp{display:flex;gap:4px;align-items:center;margin:4px 0}
.hp input{width:58px;text-align:center}
.pb{height:6px;background:#120f0b;border-radius:4px;overflow:hidden;margin:3px 0}
.pb i{display:block;height:100%;background:var(--grn)}
.pbw{position:relative;height:30px;margin:2px 0}
.pbw .pb{position:absolute;left:0;right:0;top:11px;height:8px;margin:0}
.dmgrow{position:relative;display:flex;gap:6px;align-items:center;margin:6px 0}
.dmgin{flex:none;width:84px;min-width:0;text-align:center;font-weight:700;font-size:18px}
.dt{flex:1;min-width:0}
.dt>summary{list-style:none;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dt>summary::-webkit-details-marker{display:none}
.dt[open]>summary{border-color:var(--acc)}
.dt .dtl{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:6px;max-height:280px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 8px 24px #000a}
.dtl label{display:flex;align-items:center;gap:8px;padding:9px 4px;margin:0;font-size:14px;color:var(--tx)}
.dtl input{width:20px;height:20px;flex:none}
.hpread{flex:1;display:flex;align-items:center;gap:8px}
.hpslide{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y;border:0}
.hpslide::-webkit-slider-runnable-track{height:30px;background:transparent}
.hpslide::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:28px;margin-top:1px;border-radius:8px;background:var(--acc);border:2px solid #1a1209}
.hpslide::-moz-range-track{height:30px;background:transparent}
.hpslide::-moz-range-thumb{width:20px;height:24px;border-radius:8px;background:var(--acc);border:2px solid #1a1209}
.stat b{color:var(--acc)}
.stat p{margin:3px 0}
.stat hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.stat .title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:18px;font-weight:700;border-bottom:2px solid var(--acc);padding-bottom:3px}
a{color:#e0a954}
a.gl{text-decoration:underline dotted}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--acc);border-radius:12px;padding:12px;width:min(96vw,640px);max-height:90vh}
dialog::backdrop{background:#000a}
dialog{overflow-y:auto;overscroll-behavior:contain}
#dlg2{max-height:80vh}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
details.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details.pc>summary{padding:10px;font-weight:700;cursor:pointer;list-style:none}
details.pc>div{padding:0 10px 10px}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 86px 48px 40px 38px;gap:5px;align-items:center;margin:4px 0}
.sk select{font-size:12px;padding:6px 3px}.sk .tot{text-align:center;font-weight:700;font-size:16px}
.skh{font-size:11px;color:var(--mut);text-transform:uppercase;margin-top:6px}.skh span{text-align:center}.skh span:first-child{text-align:left}
.cimg{width:52px;height:52px;border-radius:12px;display:block;border:2px solid #e0b83a;box-sizing:content-box}
.cicon{color:#e0b83a;display:inline-flex;flex:none;margin-left:auto;padding-right:2px}
.over{border-color:#4a9ad8;color:#8fc9ff;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx);margin:6px 0}
.chk input{width:24px;height:24px;flex:none}
.statb{display:flex;flex-direction:column;align-items:center;padding:4px 2px;min-height:50px;line-height:1.2}
.statb b{font-size:17px}
button.lg{font-size:17.6px;padding:9px 12px;min-height:42px}
button.sm.lg{font-size:14.3px;padding:5px 9px;min-height:33px}
button:active{filter:brightness(1.6)}
.tap{background:var(--acc)!important;color:#1a1209!important;border-color:var(--acc)!important}
.sk span{overflow:hidden;text-overflow:ellipsis}
.banner{background:#2a2110;border:1px solid var(--acc);border-radius:8px;padding:8px;margin:8px 0;font-weight:600}
.lvl{display:inline-block;min-width:34px;text-align:center;background:var(--acc);color:#1a1209;font-weight:700;border-radius:6px;padding:1px 4px;margin-right:6px}
.li{display:flex;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.li:active{background:var(--card2)}
.lhead{border-bottom:2px solid var(--acc);color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.04em;pointer-events:none}
.lhead b{font-weight:600}.lh{background:none;color:var(--acc)}
.row.blk{display:block}
.rh{display:flex;gap:8px;align-items:center}
.rh .nm{flex:1;min-width:0;font-size:17px}
.hprow{display:flex;gap:12px;align-items:flex-end;margin:8px 0}
.hpctl{flex:1;display:flex;gap:4px;align-items:center;min-width:0}
.hpctl input{flex:1;min-width:0;text-align:center;font-weight:700;font-size:18px}
.hpctl button{flex:none}
.maxbox{width:84px;flex:none;border-left:1px solid var(--line);padding-left:10px}
.maxbox input{text-align:center}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.acts .grow{flex:1}
.big{min-height:48px;padding:10px 22px;font-size:17px;font-weight:700;background:var(--acc);color:#1a1209;border-color:var(--acc)}
.cnd{display:inline-flex;align-items:center;gap:2px;background:#3a2f20;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;margin:2px 3px 2px 0;font-size:13px}
.cnd a{text-decoration:none;color:var(--tx);margin-right:2px}
.cnd button{min-height:26px;min-width:26px;padding:0 6px;border-radius:50%;font-size:14px;line-height:1}
.pmt{background:#2a2110;border:1px solid var(--acc);border-radius:8px;padding:8px;margin:6px 0}
.pcc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.pch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;min-height:52px}
.pcb{padding:0 10px 10px}
.chev{min-width:46px;min-height:46px;font-size:18px;flex:none;border-radius:10px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<input type="file" id="file" accept="*/*" hidden>
<script src="creatures.js"></script>
<script src="icons.js"></script>
<script>
"use strict";
/* ---------- state ---------- */
const KEY = "pf2gm.v1";
const SKILLS = ["Acrobatics","Arcana","Athletics","Crafting","Deception","Diplomacy","Intimidation","Medicine","Nature","Occultism","Performance","Religion","Society","Stealth","Survival","Thievery"];
const PROF = {U:"Untrained",T:"Trained",E:"Expert",M:"Master",L:"Legendary",X:"Mythic"};
const PSHORT = {U:"U",T:"T",E:"E",M:"M",L:"L",X:"Myth"};
const PBONUS = {U:0,T:2,E:4,M:6,L:8,X:10};
const ABIL = ["Str","Dex","Con","Int","Wis","Cha"];
const ABIL_NAME = {Str:"Strength",Dex:"Dexterity",Con:"Constitution",Int:"Intelligence",Wis:"Wisdom",Cha:"Charisma"};
const SKILL_ABIL = {Acrobatics:"Dex",Arcana:"Int",Athletics:"Str",Crafting:"Int",Deception:"Cha",Diplomacy:"Cha",Intimidation:"Cha",Medicine:"Wis",Nature:"Wis",Occultism:"Int",Performance:"Cha",Religion:"Wis",Society:"Int",Stealth:"Dex",Survival:"Wis",Thievery:"Dex"};
/* modifier = (level + proficiency, or 0 if untrained) + ability modifier + item bonus */
function skillObj(p, key){ return key === "Perception" ? p.perc : key.startsWith("lore:") ? p.lores[+key.slice(5)] : p.skills[key]; }
function skillMod(p, key){
  const o = skillObj(p, key); if(!o) return 0;
  const ab = key === "Perception" ? "Wis" : key.startsWith("lore:") ? "Int" : SKILL_ABIL[key];
  const prof = (o.prof && o.prof !== "U") ? (+p.level||0) + (PBONUS[o.prof]||0) : 0;
  return prof + (+(p.abil||{})[ab] || 0) + (+o.item || 0);
}
const LANG_COMMON = ["Common","Draconic","Dwarven","Elven","Fey","Gnomish","Goblin","Halfling","Jotun","Orcish","Sakvroth"];
const LANG_UNCOMMON = ["Aklo","Chthonian","Diabolic","Empyrean","Kholo","Muan","Necril","Petran","Pyric","Shadowtongue","Sussuran","Talican","Thalassic"];
const EXPLORE = ["Search","Investigate","Avoid Notice","Defend","Scout","Repeat a Spell"];   // plus "Other" for manual entry
const pcExtras = p => [p.languages && p.languages.length ? `<b>Languages</b> ${esc(p.languages.join(", "))}` : "", p.explore ? `<b>Exploration</b> ${esc(p.explore)}` : ""].filter(Boolean);
/* Original line icons for the class picker (not Paizo artwork). */
const CLASS_ICONS = {
 Alchemist:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/>',
 Animist:'<circle cx="12" cy="12" r="3"/><path d="M12 3c-3 3 3 5 0 9M12 21c3-3-3-5 0-9M3 12c3-3 5 3 9 0M21 12c-3 3-5-3-9 0"/>',
 Barbarian:'<path d="M12 3v18"/><path d="M12 4c4-2 8 0 8 4 0 3-4 4-8 3z"/>',
 Bard:'<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
 Champion:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M12 8v8M8.5 11.5h7"/>',
 Cleric:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 Commander:'<path d="M6 21V3"/><path d="M6 4h13l-3 4 3 4H6"/>',
 Druid:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19L14 10"/>',
 Exemplar:'<path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',
 Fighter:'<path d="M4 4l14 14M20 4L6 18"/><path d="M14 18l4-4M10 18l-4-4"/>',
 Guardian:'<path d="M6 3h12v11c0 4-3 6-6 7-3-1-6-3-6-7z"/><path d="M12 7v10"/>',
 Gunslinger:'<circle cx="12" cy="12" r="6"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>',
 Inventor:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 2.1" stroke-width="4"/><circle cx="12" cy="12" r="3"/>',
 Investigator:'<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>',
 Kineticist:'<path d="M12 12c0-2 3-2 3 0s-1 5-5 5-7-3-7-7 4-8 9-8 9 4 9 9"/>',
 Magus:'<path d="M4 20L16 8"/><path d="M3 21l3-3"/><path d="M17 3l1 2.5 2.5 1-2.5 1L17 10l-1-2.5-2.5-1 2.5-1z"/>',
 Monk:'<path d="M12 4c3 3 3 8 0 12-3-4-3-9 0-12z"/><path d="M12 16c-1-4-5-6-9-6 0 4 3 8 9 8M12 16c1-4 5-6 9-6 0 4-3 8-9 8"/>',
 Oracle:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 Psychic:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 Ranger:'<path d="M6 3c8 3 8 15 0 18"/><path d="M6 3v18"/><path d="M6 12h15M17 9l4 3-4 3"/>',
 Rogue:'<path d="M12 2l3 11H9z"/><path d="M7 13h10M12 13v8"/>',
 Sorcerer:'<path d="M12 22c-4 0-6-3-6-6 0-4 4-6 4-11 4 2 8 6 8 11 0 3-2 6-6 6z"/><path d="M12 22c-2 0-3-1-3-3s2-3 3-5c2 2 3 3 3 5s-1 3-3 3z"/>',
 Summoner:'<ellipse cx="12" cy="12" rx="5" ry="9"/><path d="M3 12h4M17 12h4"/><circle cx="12" cy="12" r="1.5"/>',
 Swashbuckler:'<path d="M4 20L19 5"/><path d="M15 3l6 6"/><path d="M7 17c-2 0-3 2-3 4 2 0 4-1 4-3"/>',
 Thaumaturge:'<path d="M12 3l7 4v10l-7 4-7-4V7z"/><circle cx="12" cy="12" r="2.5"/>',
 Witch:'<path d="M12 2l5 14H7z"/><path d="M3 17c5 3 13 3 18 0"/>',
 Wizard:'<path d="M12 6c-2-2-6-2-9-1v14c3-1 7-1 9 1 2-2 6-2 9-1V5c-3-1-7-1-9 1z"/><path d="M12 6v14"/>'
};
const CLASS_LIST = Object.keys(CLASS_ICONS);
const classKey = s => CLASS_LIST.find(k => k.toLowerCase() === String(s||"").trim().toLowerCase()) || "";
const CLASS_IMG = window.CLASS_IMG || {};   // class artwork, embedded in icons.js
const svgIcon = k => `<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${CLASS_ICONS[k]}</svg>`;
const classIcon = (cls, size) => { const k = classKey(cls); if(!k) return "";
  const img = CLASS_IMG[k.toLowerCase()];
  return `<span class="cicon" title="${k}">${img ? `<img class="cimg" src="${img}" alt="${k}" width="52" height="52" ${size?`style="width:${size}px;height:${size}px"`:""}>` : svgIcon(k)}</span>`; };
function ensurePC(p){
  p.abil = p.abil || {}; ABIL.forEach(k => { if(p.abil[k] == null) p.abil[k] = 0; });
  p.perc = p.perc || {prof:"T"}; p.skills = p.skills || {}; p.lores = p.lores || [];
  SKILLS.forEach(s => { if(!p.skills[s]) p.skills[s] = {prof:"U"}; });
  [p.perc].concat(SKILLS.map(s => p.skills[s]), p.lores).forEach(o => { if(o.item == null) o.item = 0; });
  p.trackHp = !!p.trackHp; p.pilgrim = !!p.pilgrim; p.diehard = !!p.diehard;
  if(!Array.isArray(p.languages)) p.languages = typeof p.languages === "string" && p.languages.trim() ? p.languages.split(/[,;]\s*/).filter(Boolean) : [];
  p.explore = p.explore || "";
}
let S = (function(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } })() || {pcs:[],encs:[],runs:[],custom:[],run:null};
// Encounters on the Encounters page are designs (members only). Running copies live in S.runs.
function migrate(){
  S.pcs = S.pcs||[]; S.encs = S.encs||[]; S.runs = S.runs||[]; S.custom = S.custom||[];
  S.settings = Object.assign({hpMode:"slider", trackPcDefault:false}, S.settings || {});
  const old = S.encs.filter(e => Array.isArray(e.list));          // older versions kept running data in S.encs
  const designs = [];
  old.forEach(e => {
    const oldId = e.id;
    const all = (e.list||[]).concat(e.delayed||[], e.out||[]);
    const groups = {}, members = [];
    all.forEach(c => {
      if(c.kind === "pc") members.push({id:uid(), kind:"pc", ref:c.ref, tpl:"", qty:1});
      else { const k = c.ref + "|" + (c.tpl||""); if(groups[k]) groups[k].qty++; else { groups[k] = {id:uid(), kind:"creature", ref:c.ref, tpl:c.tpl||"", qty:1}; members.push(groups[k]); } }
    });
    designs.push({id:oldId, name:e.name, notes:e.notes||"", members});
    if((e.round||1) > 1 || all.some(c => c.init !== "" && c.init != null)){   // keep combats that were in progress
      e.src = oldId; e.id = uid(); e.setup = false; e.delayed = e.delayed||[]; e.out = e.out||[];
      S.runs.push(e); if(S.cur === oldId) S.run = e.id;
    }
  });
  S.encs = S.encs.filter(e => !Array.isArray(e.list)).concat(designs);
  delete S.cur;
  S.encs.forEach(d => { d.members = d.members||[]; });
  S.runs.forEach(e => { e.out = e.out||[]; e.delayed = e.delayed||[]; e.list.concat(e.delayed, e.out).forEach(c => { c.conds = c.conds||[]; if(c.cond){ c.note = c.cond; } delete c.cond; }); });
  if(S.run === undefined) S.run = null;
  S.pcs.forEach(ensurePC);
}
const UI = {dmg:{}, hit:{}, heal:{}, sort:"lvl", view:"combat", q:"", draft:null, open:{}, secret:"", dc:"", fileMode:"", buildId:null};
function save(){
  // The top card is always the current turn; "lead" marks who starts each round.
  S.runs.forEach(e => {
    if(!e.list.length){ e.active = null; e.lead = null; return; }
    e.active = e.list[0].id;
    if(!e.list.some(c => c.id === e.lead)) e.lead = e.active;
  });
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const allCreatures = () => (window.BUNDLED_CREATURES||[]).concat(S.custom);

const GKEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRE = new RegExp("\\b(" + GKEYS.map(k=>k.replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&")).join("|") + ")\\b","gi");
const linkify = text => esc(text).replace(GRE, m => `<a href="#" class="gl" data-act="gloss" data-g="${m.toLowerCase()}">${m}</a>`);

/* ---------- Weak / Elite templates (Monster Core "Creature Adjustments") ---------- */
const eliteHP = l => l<=1?10 : l<=4?15 : l<=19?20 : 30;
const weakHP  = l => l<=2?10 : l<=5?15 : l<=20?20 : 30;
function shiftNums(str, d){
  return String(str==null?"":str).replace(/([+-])\s?(\d+)/g, (m,s,n) => { const v = (s==="-"?-1:1)*parseInt(n,10) + d; return (v<0?"-":"+") + Math.abs(v); });
}
function shiftDamage(str, d){
  return String(str||"").replace(/(\d+d\d+)(\s?[+-]\s?\d+)?/, (m,dice,flat) => {
    const base = flat ? parseInt(flat.replace(/\s/g,""),10) : 0; const v = base + d;
    return dice + (v===0 ? "" : (v<0?"-":"+") + Math.abs(v));
  });
}
function applyTemplate(c, tpl){
  if(!c || (tpl!=="elite" && tpl!=="weak")) return c;
  const x = JSON.parse(JSON.stringify(c)); const el = tpl==="elite"; const d = el?2:-2; const L = +c.level||0;
  x.tpl = tpl; x.name = (el?"Elite ":"Weak ") + c.name;
  x.level = el ? (L<=0 ? L+2 : L+1) : (L===1 ? -1 : Math.max(-1, L-1));
  x.ac = (+c.ac||0) + d;
  x.perception = shiftNums(c.perception, d);
  if(c.skills) x.skills = shiftNums(c.skills, d);
  if(c.saves) Object.keys(c.saves).forEach(k => x.saves[k] = shiftNums(c.saves[k], d));
  x.hp = Math.max(1, (+c.hp||0) + (el ? eliteHP(L) : -weakHP(L)));
  (x.attacks||[]).forEach(a => { a.bonus = shiftNums(a.bonus, d); a.damage = shiftDamage(a.damage, d); });
  (x.abilities||[]).forEach(a => { a.text = String(a.text||"").replace(/\bDC (\d+)/g, (m,n) => "DC " + (parseInt(n,10)+d)); });
  if(x.spells) x.spells = x.spells.map(s => String(s).replace(/\bDC (\d+)/g, (m,n) => "DC " + (parseInt(n,10)+d)).replace(/attack ([+-]\d+)/g, (m,n) => "attack " + shiftNums(n,d)));
  return x;
}
const getCreatureT = (id, tpl) => applyTemplate(getCreature(id), tpl);

/* ---------- creature card ---------- */
const acts = {"1":"◆","2":"◆◆","3":"◆◆◆",reaction:"⤺",free:"◇"};
const fmt = t => linkify(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
const srcLabel = s => /Monster Core 2/.test(s) ? "Monster Core 2" : /Monster Core/.test(s) ? "Monster Core 1" : s;
function card(c){
  const am = c.abilityMods||{}, sv = c.saves||{};
  const glyph = a => acts[a.action] || (a.action && a.action!=="passive" ? `[${esc(a.action)}]` : "");
  const abHTML = a => `<p><b>${linkify(a.name)}</b> ${glyph(a)} ${a.traits?`<span class="small mut">(${esc(a.traits)})</span> `:""}${fmt(a.text||"")}</p>`;
  const ab = cat => (c.abilities||[]).filter(a => (a.cat||"offensive") === cat).map(abHTML).join("");
  const att = (c.attacks||[]).map(a => `<p><b>${esc(a.type||"Melee")}</b> <span title="action">${acts[a.action]||""}</span> ${linkify(a.name)} ${esc(a.bonus||"")} ${a.traits?`(${esc(a.traits)})`:""}, <b>Damage</b> ${linkify(a.damage||"")}</p>`).join("");
  const sp = (c.spells||[]).map(s => `<p>${fmt(s)}</p>`).join("");
  return `<div class="stat">
    <div class="title"><span>${esc(c.name)}</span><span class="small">Creature ${esc(c.level)}</span></div>
    ${c.tpl?`<p><span class="chip ${c.tpl==="elite"?"red":"grn"}">${c.tpl==="elite"?"Elite":"Weak"} template applied</span> <span class="small mut">${c.tpl==="elite"?"+2":"−2"} to AC, attacks, DCs, saves, Perception, skills; ${c.tpl==="elite"?"+2":"−2"} Strike damage; HP adjusted. Damage inside ability text and limited-use abilities (±4) are not changed; check those by hand.</span></p>`:""}
    <p>${(c.traits||[]).map(t=>`<span class="chip">${linkify(t)}</span>`).join("")}</p>
    ${c.recall?`<p><b>Recall Knowledge</b> ${esc(c.recall)}</p>`:""}
    <p><b>Perception</b> ${linkify(c.perception||"")}</p>
    ${c.languages?`<p><b>Languages</b> ${esc(c.languages)}</p>`:""}
    ${c.skills?`<p><b>Skills</b> ${esc(c.skills)}</p>`:""}
    <p>${["Str","Dex","Con","Int","Wis","Cha"].map(k=>`<b>${k}</b> ${esc(am[k]||"+0")}`).join(", ")}</p>
    ${c.items?`<p><b>Items</b> ${esc(c.items)}</p>`:""}
    ${ab("interaction")}
    <hr>
    <p><b>AC</b> ${esc(c.ac)}${c.acNote?` (${esc(c.acNote)})`:""}; <b>Fort</b> ${esc(sv.Fort)}, <b>Ref</b> ${esc(sv.Ref)}, <b>Will</b> ${esc(sv.Will)}${c.savesNote?`; ${linkify(c.savesNote)}`:""}</p>
    <p><b>HP</b> ${esc(c.hp)}${c.defenses?`; ${linkify(c.defenses)}`:""}</p>
    ${(c.traits||[]).some(t => /^construct$/i.test(t)) ? `<p><a href="#" class="gl" data-act="gloss" data-g="construct immunities">Construct Immunities</a></p>` : ""}
    ${ab("defensive")}
    <hr>
    <p><b>Speed</b> ${esc(c.speed||"")}</p>
    ${att}${sp}${ab("offensive")}
    ${c.url?`<p class="small"><a href="${esc(c.url)}" target="_blank" rel="noopener">Open on Archives of Nethys ↗</a></p>`:`<p class="small"><a href="${q(c.name.replace(/\s*\(.*$/, ""))}" target="_blank" rel="noopener">Search the wiki for ${esc(c.name)} ↗</a></p>`}
    ${c.source?`<p class="small mut">${esc(srcLabel(c.source))}</p>`:""}
  </div>`;
}

dlg2.addEventListener("click", e => { if(e.target === dlg2 && outside(dlg2, e)) dlg2.close(); });

/* ---------- combat logic ---------- */
function newEnc(name){
  const d = {id:uid(), name:name||"New Encounter", notes:"", members:[]};
  S.encs.push(d); UI.buildId = d.id; UI.open["enc:" + d.id] = true; save(); return d;
}
function findCB(id){
  for(const e of S.runs){ const c = e.list.find(x=>x.id===id) || e.delayed.find(x=>x.id===id) || (e.out||[]).find(x=>x.id===id); if(c) return c; }
  return null;
}
function sortInit(e){
  // On a tie a creature acts before a PC, unless that PC has Pilgrim's Token (then the PC goes first).
  const rank = c => { if(c.kind !== "pc") return 1; const p = S.pcs.find(x => x.id === c.ref); return p && p.pilgrim ? 0 : 2; };
  e.list.sort((a,b) => (num(b.init)-num(a.init)) || (rank(a)-rank(b)));
  if(e.list.length) e.lead = e.list[0].id;
}
const num = v => (v===""||v==null||isNaN(v)) ? -999 : +v;
/* Encounter designer (Encounters page) */
function addMember(did, cid, qty, tpl){
  const d = S.encs.find(x => x.id === did); if(!d || !getCreature(cid)) return;
  tpl = tpl || "";
  const g = d.members.find(m => m.kind === "creature" && m.ref === cid && (m.tpl||"") === tpl);
  if(g) g.qty += qty; else d.members.push({id:uid(), kind:"creature", ref:cid, tpl, qty});
  save();
}
function addPartyMembers(did){
  const d = S.encs.find(x => x.id === did); if(!d) return;
  S.pcs.forEach(p => { if(!d.members.some(m => m.kind === "pc" && m.ref === p.id)) d.members.push({id:uid(), kind:"pc", ref:p.id, tpl:"", qty:1}); });
  save();
}
/* Starting an encounter makes an independent copy that lives on the Combat page */
function startRun(did){
  const d = S.encs.find(x => x.id === did); if(!d) return null;
  const run = {id:uid(), src:did, name:d.name, notes:d.notes||"", round:1, active:null, lead:null, setup:true, list:[], delayed:[], out:[]};
  d.members.forEach(m => {
    if(m.kind === "pc"){
      const p = S.pcs.find(x => x.id === m.ref); if(!p) return;
      run.list.push({id:uid(), kind:"pc", ref:p.id, name:p.name, init:"", hp:+p.hp||0, max:+p.hp||0, conds:[], note:"", dying:0, wounded:0});
    } else {
      const c = getCreatureT(m.ref, m.tpl); if(!c) return;
      const mod = parseMod(c.perception), n = Math.max(1, m.qty||1);
      for(let i=1;i<=n;i++) run.list.push({id:uid(), kind:"creature", ref:m.ref, tpl:m.tpl||"", name: n>1 ? `${c.name} ${i}` : c.name, init:"", mod, hp:+c.hp||0, max:+c.hp||0, conds:[], note:"", dying:0, wounded:0});
    }
  });
  S.runs.push(run); S.run = run.id; save(); return run;
}
function beginDesign(did){
  const d = S.encs.find(x => x.id === did); if(!d) return;
  if(!d.members.length){ alert("This encounter is empty. Add the party and creatures on the Encounters page first."); render(); return; }
  if(S.runs.some(r => r.src === did) && !confirm(`"${d.name}" already has an underway copy. Start another new copy?`)){ render(); return; }
  startRun(did); UI.view = "combat"; render(); rollDialog();
}
function pickRun(v){
  if(!v) return;
  const k = v.slice(0,1), id = v.slice(2);
  if(k === "r"){ S.run = id; save(); render(); return; }
  beginDesign(id);
}
function runLabel(r){
  const same = S.runs.filter(x => x.src === r.src), n = same.indexOf(r) + 1;
  return `${r.name} (Underway${n > 1 ? " " + n : ""})`;
}
function rollDialog(){
  openDlg(`<h2>Roll Initiative?</h2>
    <p class="small mut">Creatures roll d20 + Perception. PCs can roll from the Perception on their sheet, or you can type in what your players rolled; the order re-sorts as you enter numbers.</p>
    <div class="g"><button class="big" data-act="roll-all">Roll for everyone</button><button class="big" data-act="roll-cr">Creatures only</button><button data-act="roll-no">Not now</button></div>`, true);
}
function nextTurn(dir){
  UI.secret = "";                                   // the turn moved on, so the last secret roll goes away
  const e = curEnc(); if(!e || !e.list.length) return;
  if(!e.list.some(c => c.id === e.lead)) e.lead = e.list[0].id;
  if(dir > 0){
    e.list.push(e.list.shift());                    // top card goes to the bottom
    if(e.list[0].id === e.lead) e.round++;          // round-start combatant is up again
  } else {
    e.list.unshift(e.list.pop());                   // bottom card comes back to the top
    if(e.list.length > 1 && e.list[1].id === e.lead) e.round = Math.max(1, e.round - 1);
  }
  save();
}
function moveCB(id, d){
  const e = curEnc(); const i = e.list.findIndex(c=>c.id===id); const j = i+d;
  if(i<0||j<0||j>=e.list.length) return;
  const t = e.list[i]; e.list[i] = e.list[j]; e.list[j] = t; save();
}
function delayCB(id){
  const e = curEnc(); const i = e.list.findIndex(c=>c.id===id); if(i<0) return;
  const [c] = e.list.splice(i,1);
  e.delayed.push(c); save();
}
function returnCB(id){
  const e = curEnc(); const k = e.delayed.findIndex(c=>c.id===id); if(k<0) return;
  const [c] = e.delayed.splice(k,1);
  e.list.splice(e.list.length ? 1 : 0, 0, c);       // right after the current turn
  save();
}
function dyingDialog(id, fromZero){
  const e = curEnc(); const c = findCB(id);
  const opts = e.list.filter(x=>x.id!==id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  openDlg(`<h2>${esc(c.name)} drops</h2>
    <p class="small mut">Sets HP to 0, applies Dying (+Wounded), and moves them in initiative to just before whoever caused it.</p>
    <label>Dropped by</label><select id="dsrc"><option value="">(no change in order)</option>${opts}</select>
    <div class="g g2" style="margin-top:8px"><div><label>Wounded value</label><input id="dwd" type="number" min="0" value="${c.wounded||0}"></div>
    <div><label>Critical hit / crit failure?</label><select id="dcrit"><option value="1">No (Dying 1)</option><option value="2">Yes (Dying 2)</option></select></div></div>
    <div class="bar" style="margin-top:12px"><button class="pri" data-act="dying-ok" data-id="${id}">Apply</button>${fromZero?`<button data-act="z-back" data-id="${id}">Back</button>`:'<button data-act="close">Cancel</button>'}</div>`, !!fromZero);
}
function applyDying(id){
  const e = curEnc(); const c = findCB(id);
  const wd = parseInt($("#dwd").value,10)||0; const base = parseInt($("#dcrit").value,10)||1; const src = $("#dsrc").value;
  c.hp = 0; c.wounded = wd; c.dying = base + wd;
  if(src){
    const i = e.list.findIndex(x=>x.id===id);
    if(i>=0){
      const wasActive = e.active === id;
      const [m] = e.list.splice(i,1);
      const j = e.list.findIndex(x=>x.id===src);
      e.list.splice(j,0,m);
      if(wasActive) e.active = m.id;
    }
  }
  save();
  if(UI.pending) finishNext(); else { closeDlg(); render(); }
}
function rollInit(everyone){
  const e = curEnc(); if(!e) return;
  e.list.forEach(c => {
    if(c.kind === "creature") c.init = d20() + (c.mod||0);
    else if(everyone){ const p = S.pcs.find(x => x.id === c.ref); c.init = d20() + (p ? skillMod(p, "Perception") : 0); }
  });
  sortInit(e); save();
}

const VALUED = new Set(CONDS.filter(x => x[1]).map(x => x[0]));
const NEEDS_DETAIL = new Set(["Persistent Damage","Poisoned"]);
const DEG = ["Critical Failure","Failure","Success","Critical Success"];
const hasCond = (c,n) => (c.conds||[]).some(k => k.n === n);
function addCond(c, n, d){
  c.conds = c.conds || [];
  if(hasCond(c,n) && !NEEDS_DETAIL.has(n)) return;
  c.conds.push({n, v: VALUED.has(n) ? 1 : null, d: d || ""});
}
function degreeOf(r, dc){
  let d = r >= dc+10 ? 3 : r >= dc ? 2 : r <= dc-10 ? 0 : 1;
  if(r === 20) d = Math.min(3, d+1);
  if(r === 1) d = Math.max(0, d-1);
  return d;
}
function condChip(c, k, i){
  const val = VALUED.has(k.n);
  const lab = k.n + (val ? " " + k.v : "") + (k.d ? " (" + k.d + ")" : "");
  return `<span class="cnd"><a href="#" data-act="cond-info" data-n="${esc(k.n)}">${esc(lab)}</a>${val?`<button data-act="cond-val" data-id="${c.id}" data-i="${i}" data-d="-1">−</button><button data-act="cond-val" data-id="${c.id}" data-i="${i}" data-d="1">+</button>`:""}<button data-act="cond-rm" data-id="${c.id}" data-i="${i}">×</button></span>`;
}
function condInfo(n){
  const g = GLOSS[n.toLowerCase()];
  openDlg(`<h2>${esc(n)}</h2><p>${g ? esc(g.s) : "No quick summary saved for this condition; see the wiki."}</p>
    <div class="bar"><a href="${esc(g ? g.url : q(n))}" target="_blank" rel="noopener"><button class="pri">Open on Archives of Nethys ↗</button></a><button data-act="close">Close</button></div>`);
}
function condDialog(id){
  const c = findCB(id); if(!c) return;
  openDlg(`<h2>Conditions · ${esc(c.name)}</h2>
    <p class="small mut">Tap to add or remove. Valued conditions start at 1; change the number on the card. Dying and Wounded use the Dying button.</p>
    <label>Detail for Persistent Damage / Poisoned (e.g. 1d6 fire, or the poison's name)</label><input id="cdetail" placeholder="1d6 fire">
    <div class="bar" style="margin-top:8px">${CONDS.map(([n]) => `<button class="sm ${hasCond(c,n)?"pri":""}" data-act="cond-toggle" data-id="${id}" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <label>Notes</label><input data-set="cb|${id}|note" value="${esc(c.note||"")}">
    <div class="bar" style="margin-top:10px"><button class="pri" data-act="close">Done</button></div>`);
}
function endItems(c){
  const o = [];
  (c.conds||[]).forEach((k,i) => { if(k.n==="Frightened") o.push({t:"fright",i}); if(k.n==="Persistent Damage") o.push({t:"persist",i}); });
  return o;
}
function startItems(c){
  const o = [];
  if(c.dying > 0 && c.dying < deadAt(c)) o.push({t:"dying"});
  (c.conds||[]).forEach((k,i) => {
    if(k.n==="Stunned") o.push({t:"stun",i});
    if(k.n==="Slowed") o.push({t:"info", x:`Slowed ${k.v}: ${k.v} fewer action${k.v>1?"s":""} this turn.`});
    if(k.n==="Poisoned") o.push({t:"info", x:`Poisoned${k.d?" ("+k.d+")":""}: roll the poison's save and advance its stage now, as the poison's listing directs.`});
  });
  if(c.kind === "creature"){
    const cr = getCreatureT(c.ref, c.tpl);
    ((cr && cr.abilities) || []).forEach(a => {
      if(!/fast healing|regeneration/i.test(a.name)) return;
      const x = `${a.name} (start of turn)${a.text?": "+a.text.replace(/\*\*/g,""):""}`;
      const m = a.name.match(/\d+/) || (a.text||"").match(/(?:fast healing|regeneration)\s+(\d+)/i);   // amount, when the entry states one
      if(m) o.push({t:"heal", x, key:a.name, amt:+(m[1]||m[0])});
      else o.push({t:"info", x});
    });
  }
  return o;
}
/* A creature dies at Dying 4; a PC with the Diehard feat at Dying 5. */
function deadAt(c){ if(c.kind !== "pc") return 4; const p = S.pcs.find(x => x.id === c.ref); return p && p.diehard ? 5 : 4; }
function recover(c, deg){
  const before = c.dying;
  c.dying = Math.max(0, c.dying + [2,1,-1,-2][deg]);
  const head = `Dying ${before} → `;
  const dead = deadAt(c);
  if(c.dying >= dead){ c.dying = dead; return head + dead + ": dead."; }
  if(c.dying === 0){ c.wounded = (c.wounded||0) + 1; addCond(c,"Unconscious"); return head + `0: stabilized, unconscious at 0 HP, Wounded ${c.wounded}.`; }
  return head + c.dying + ".";
}
/* ---------- creature damage entry ---------- */
const DMG_TYPES = ["bludgeoning","piercing","slashing","acid","cold","electricity","fire","force","mental","poison","sonic","spirit","vitality","void","bleed","precision","cold iron","silver","adamantine","holy","unholy","area damage","splash damage"];
const PHYS_TYPES = ["bludgeoning","piercing","slashing"];
function parseDefs(c){
  const d = (getCreatureT(c.ref, c.tpl) || {}).defenses || "", o = {imm:[], weak:[], res:[]};
  String(d).split(";").forEach(seg => {
    const m = seg.trim().match(/^(immunities|weaknesses|resistances)\s+(.+)$/i); if(!m) return;
    const k = m[1][0].toLowerCase() === "i" ? "imm" : m[1][0].toLowerCase() === "w" ? "weak" : "res";
    m[2].split(/,(?![^()]*\))/).forEach(it => {
      it = it.trim(); const ex = /except/i.test(it), base = it.replace(/\(.*?\)/g, "").trim();
      if(k === "imm") o.imm.push({t:base.toLowerCase(), ex});
      else { const mm = base.match(/^(.*?)\s+(\d+)$/); if(mm) o[k].push({t:mm[1].toLowerCase(), v:+mm[2], ex}); }
    });
  });
  return o;
}
const dmgHit = (entry, t) => entry === t || entry === "all damage" || (entry === "physical" && PHYS_TYPES.includes(t));
const dmState = id => (UI.dmg[id] = UI.dmg[id] && UI.dmg[id].rows ? UI.dmg[id] : {rows:[{amt:"", types:[]}]});
const dmReset = id => { UI.dmg[id] = {rows:[{amt:"", types:[]}]}; };
/* Each row is one kind of damage (e.g. 7 slashing, 3 fire). Resistances and immunities apply to each row on its own. */
function calcRows(c, rows){
  const d = parseDefs(c), usedWeak = {}, lines = []; let total = 0, adj = false;
  rows.forEach(r => {
    const amt = parseInt(r.amt, 10); if(!amt) return;
    const T = (r.types || []).map(t => t.toLowerCase());
    const ln = {amt, label:T.join(", ") || "untyped", notes:[], final:amt};
    if(T.length){
      const imm = T.filter(t => d.imm.some(x => dmgHit(x.t, t)));
      if(imm.length === T.length){ ln.final = 0; ln.notes.push("Immune to " + imm.join(", ") + ": no damage."); }
      else {
        if(imm.length) ln.notes.push("Immune to " + imm.join(", ") + ". If part of this was that type, add it as its own type with + Type.");
        let w = 0, wk = "", wn = "", rs = 0, rn = "";
        d.weak.forEach((x, i) => { if(!usedWeak[i] && T.some(t => dmgHit(x.t, t)) && x.v > w){ w = x.v; wk = i; wn = x.t; } });
        d.res.forEach(x => { if(T.some(t => dmgHit(x.t, t)) && x.v > rs){ rs = x.v; rn = x.t + (x.ex ? " (has an exception, check the card)" : ""); } });
        if(w){ usedWeak[wk] = true; ln.notes.push("Weakness " + wn + " " + w + ": +" + w); }
        if(rs) ln.notes.push("Resistance " + rn + " " + rs + ": −" + rs);
        ln.final = Math.max(0, amt + w - rs);
      }
    }
    if(ln.notes.length) adj = true;
    total += ln.final; lines.push(ln);
  });
  return {total, lines, adj};
}
function dmgBlock(c){
  const st = dmState(c.id);
  const rows = st.rows.map((r, i) => `<div class="dmgrow"><input class="dmgin" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Dmg" aria-label="Damage" data-dmg="${c.id}|${i}" value="${esc(r.amt)}">
      <details class="dt"><summary>${esc(r.types.length ? r.types.join(", ") : "Type")}</summary><div class="dtl">${DMG_TYPES.map(t => `<label><input type="checkbox" data-dtype="${c.id}|${i}|${t}" ${r.types.includes(t) ? "checked" : ""}>${t}</label>`).join("")}</div></details>${st.rows.length > 1 ? `<button class="sm" data-act="dmg-rowx" data-id="${c.id}" data-i="${i}" aria-label="Remove this type">×</button>` : ""}</div>`).join("");
  return `${rows}<div class="dmgrow"><button class="sm" data-act="dmg-row" data-id="${c.id}">+ Type</button><button class="sm pri" data-act="dmg-apply" data-id="${c.id}">Damage</button><button class="sm" data-act="dmg-heal" data-id="${c.id}">Heal</button></div>
    <div class="hprow"><div class="hpread"><button class="sm" data-act="hp-set" data-id="${c.id}">HP <b class="${c.max && c.hp > c.max ? "over" : ""}">${c.hp}</b> / ${esc(c.max)}</button>${UI.hit[c.id] != null ? `<a href="#" class="small" data-act="dmg-undo" data-id="${c.id}">Undo last (was ${UI.hit[c.id]})</a>` : ""}</div>
      <div class="maxbox"><label>Max HP</label><input type="number" min="0" inputmode="numeric" data-num data-set="cb|${c.id}|max" value="${c.max}"></div></div>`;
}
function dealDamage(id, final){
  const c = findCB(id); if(!c) return;
  const old = +c.hp || 0;
  c.hp = Math.max(0, old - final); UI.hit[id] = old; dmReset(id);
  save(); render();
  if(old > 0 && c.hp <= 0 && !(c.dying > 0)) zeroDialog(id, old);
}
function dmgDialog(id, r){
  const c = findCB(id); if(!c) return;
  openDlg(`<h2>Damage to ${esc(c.name)}</h2>
    ${r.lines.map(l => `<div style="margin:6px 0"><b>${l.amt} ${esc(l.label)}</b> → ${l.final}${l.notes.map(n => `<div class="small mut">${esc(n)}</div>`).join("")}</div>`).join("")}
    <label>Total damage to apply</label><input id="dfinal" type="text" inputmode="numeric" value="${r.total}">
    <div class="bar" style="margin-top:12px"><button class="pri" data-act="dmg-go" data-id="${id}">Apply</button><button data-act="close">Cancel</button></div>
    <p class="small mut">Resistances and weaknesses come from the creature's card. Edit the total if you need to.</p>`);
}

const tracksHp = c => c.kind !== "pc" || !!((S.pcs.find(x => x.id === c.ref) || {}).trackHp);
function dyHeal(c, amt){          // healed out of dying: back on their feet with HP, wounded goes up
  c.hp = Math.max(1, Math.round((+c.hp || 0) + (parseFloat(amt) || 1)));
  c.dying = 0; c.wounded = (c.wounded || 0) + 1;
  c.conds = (c.conds || []).filter(k => k.n !== "Unconscious");
  return `Received healing: no longer dying${tracksHp(c) ? ", now at " + c.hp + " HP" : ""}. Wounded ${c.wounded}.`;
}
function dyStab(c){               // stabilized: stops dying, stays unconscious at 0 HP
  c.dying = 0; c.wounded = (c.wounded || 0) + 1; addCond(c, "Unconscious");
  return `Stabilized: no longer dying, unconscious at 0 HP. Wounded ${c.wounded}.`;
}
const dyButtons = (c, from) => c.kind !== "pc" ? "" : `<button class="sm pri" data-act="${from ? "dy-heal-ok" : "dy-heal"}" ${from ? 'data-from="start"' : ""} data-id="${c.id}">Received Healing</button><button class="sm pri" data-act="dy-stab" ${from ? 'data-from="start"' : ""} data-id="${c.id}">Stabilized</button>`;
function healDialog(id){
  const c = findCB(id); if(!c) return;
  openDlg(`<h2>Received Healing · ${esc(c.name)}</h2><label>HP gained</label><input id="rhamt" type="number" inputmode="numeric" min="1" value="1"><div class="bar" style="margin-top:12px"><button class="pri" data-act="dy-heal-ok" data-id="${id}">Apply</button><button data-act="close">Cancel</button></div>`);
}
function startDialog(id, msg){
  const c = findCB(id); if(!c) return;
  UI.sdMsg = msg;
  const items = startItems(c);
  if(!items.length && !msg) return;
  const rows = items.map(it => {
    if(it.t === "dying") return `<div class="pmt"><b>Recovery check</b>: flat check DC ${10+c.dying} (Dying ${c.dying}).
      <div class="bar"><button class="sm" data-act="rec" data-id="${id}" data-g="3">Crit Success</button><button class="sm" data-act="rec" data-id="${id}" data-g="2">Success</button><button class="sm" data-act="rec" data-id="${id}" data-g="1">Failure</button><button class="sm" data-act="rec" data-id="${id}" data-g="0">Crit Failure</button><button class="sm pri" data-act="rec-roll" data-id="${id}">🎲 Roll it</button></div>
      <div class="small mut">Success lowers Dying by 1 (crit: 2). Failure raises it by 1 (crit: 2). Dying 4 is death.</div>
      ${c.kind === "pc" ? `<div class="bar" style="margin-top:8px;align-items:center">${tracksHp(c) ? '<input id="rhamt" type="number" inputmode="numeric" min="1" value="1" style="width:72px"><span class="small mut">HP gained</span>' : ""}${dyButtons(c, true)}</div><div class="small mut">Already healed or stabilized by the party? Use these instead of rolling.</div>` : ""}</div>`;
    if(it.t === "stun"){ const k = c.conds[it.i]; const lose = Math.min(3, k.v); return `<div class="pmt"><b>Stunned ${k.v}</b>: lose ${lose} action${lose>1?"s":""} this turn. The value then drops to ${k.v-lose}. <span class="small mut">(Applied when you press Continue.)</span></div>`; }
    if(it.t === "heal"){ const yes = UI.heal[id + ":" + it.key] !== false; const k = esc(it.key);
      return `<div class="pmt">${esc(it.x)}<div class="bar" style="margin-top:6px"><b class="grow">Apply +${it.amt} HP${c.max?` (up to ${c.max})`:""}?</b><button class="sm ${yes?"pri":""}" data-act="heal-set" data-id="${id}" data-k="${k}" data-v="1">Yes</button><button class="sm ${yes?"":"pri"}" data-act="heal-set" data-id="${id}" data-k="${k}" data-v="0">No</button></div></div>`; }
    return `<div class="pmt">${esc(it.x)}</div>`;
  }).join("");
  openDlg(`<h2>Start of turn · ${esc(c.name)}</h2>${msg?`<div class="banner">${esc(msg)}</div>`:""}${rows}<div class="bar"><button class="pri" data-act="start-ok" data-id="${id}">Continue</button></div>`, true);
}
function applyStart(id){
  const c = findCB(id); if(!c) return;
  startItems(c).forEach(it => {      // Regeneration / Fast Healing marked "Yes": heal up to max HP (never lowers existing temp HP)
    if(it.t === "heal" && UI.heal[id + ":" + it.key] !== false && c.max) c.hp = Math.max(+c.hp || 0, Math.min(+c.max, (+c.hp || 0) + it.amt));
  });
  Object.keys(UI.heal).forEach(k => { if(k.startsWith(id + ":")) delete UI.heal[k]; });
  if(c.hp > 0 && c.dying) c.dying = 0;
  (c.conds||[]).forEach(k => { if(k.n==="Stunned"){ k.v -= Math.min(3, k.v); } });
  c.conds = (c.conds||[]).filter(k => !(VALUED.has(k.n) && k.v <= 0));
  save(); closeDlg(); render();
}
function endDialog(id){
  const c = findCB(id); const items = endItems(c);
  const rows = items.map(it => {
    const k = c.conds[it.i];
    if(it.t === "fright") return `<div class="pmt"><b>Frightened ${k.v}</b> drops to ${k.v-1} at the end of this turn.</div>`;
    return `<div class="pmt"><b>Persistent damage${k.d?": "+esc(k.d):""}</b>. Take the damage, then make a flat check to end it.
      <div class="g g2" style="margin-top:6px"><div><label>Damage taken</label><input id="pd${it.i}" type="number" inputmode="numeric" value="0"></div>
      <div><label>Flat check DC</label><select id="pdc${it.i}"><option value="15">15</option><option value="10">10 (helped)</option></select></div></div>
      <div class="bar"><button class="sm" data-act="flat" data-i="${it.i}">🎲 Roll flat check</button><label style="margin:0;display:flex;align-items:center;gap:4px"><input type="checkbox" id="pe${it.i}" style="width:auto"> Ends</label><span id="pr${it.i}" class="small mut"></span></div></div>`;
  }).join("");
  openDlg(`<h2>End of turn · ${esc(c.name)}</h2>${rows}<div class="bar"><button class="pri" data-act="end-ok" data-id="${id}">Apply &amp; Next ▶</button><button data-act="close">Cancel</button></div>`);
}
function applyEnd(id){
  const c = findCB(id); if(!c) return;
  const oldHp = +c.hp || 0; const rm = [];
  endItems(c).forEach(it => {
    const k = c.conds[it.i];
    if(it.t === "fright"){ k.v -= 1; if(k.v <= 0) rm.push(it.i); }
    else {
      const dmg = Math.max(0, parseInt($("#pd"+it.i).value,10) || 0);
      c.hp = Math.max(0, (+c.hp||0) - dmg);
      if($("#pe"+it.i).checked) rm.push(it.i);
    }
  });
  c.conds = c.conds.filter((k,i) => !rm.includes(i));
  UI.pending = id; save();
  if(oldHp > 0 && c.hp <= 0 && !(c.dying > 0)){ zeroDialog(id, oldHp); return; }
  finishNext();
}
function doNext(){
  const e = curEnc(); if(!e || !e.list.length) return;
  UI.pending = null; e.setup = false;
  const c = e.list[0];
  if(endItems(c).length){ endDialog(c.id); return; }
  UI.pending = c.id; finishNext();
}
function finishNext(){
  const e = curEnc(); const id = UI.pending; UI.pending = null;
  if(e && id && e.list[0] && e.list[0].id === id) nextTurn(1);
  closeDlg(); render();
  if(e && e.list[0]) startDialog(e.list[0].id);
}
function afterZero(){ if(UI.pending) finishNext(); else { closeDlg(); render(); } }
function zeroDialog(id, prev){
  const c = findCB(id); if(!c) return;
  UI.zprev = prev;
  openDlg(`<h2>${esc(c.name)} is at 0 HP</h2><p>Choose one:</p>
    <div class="g"><button class="big" data-act="z-remove" data-id="${id}">Remove from Initiative</button><button class="big" data-act="z-unc" data-id="${id}">Set to Unconscious</button><button class="big" data-act="z-dying" data-id="${id}">Set Dying and Move</button></div>
    <p class="small" style="margin-top:12px"><a href="#" data-act="z-undo" data-id="${id}">Mis-tap? Undo and restore ${esc(prev)} HP</a></p>`, true);
}

/* ---------- PCs ---------- */
function newPC(){
  const p = {id:uid(), name:"New PC", player:"", level:1, cls:"", anc:"", ac:10, hp:10, speed:25, fort:0, ref:0, will:0, perc:{prof:"T"}, skills:{}, lores:[], notes:"", trackHp:!!(S.settings && S.settings.trackPcDefault), pilgrim:false, diehard:false};
  ensurePC(p); S.pcs.push(p); UI.open[p.id] = true; save();
}
function secretRoll(pid, skill){
  const p = S.pcs.find(x=>x.id===pid); if(!p) return;
  let mod, label;
  mod = skillMod(p, skill);
  if(skill === "Perception") label = "Perception";
  else if(skill.startsWith("lore:")) label = (p.lores[+skill.slice(5)].name||"Lore") + " Lore";
  else label = skill;
  const r = d20(), tot = r + mod;
  let txt = `${p.name} — ${label}: d20 ${r} ${sgn(mod)} = ${tot}`;
  const dc = parseInt(UI.dc,10);
  if(!isNaN(dc)){
    let d = tot >= dc+10 ? 3 : tot >= dc ? 2 : tot <= dc-10 ? 0 : 1;
    if(r===20) d = Math.min(3,d+1); if(r===1) d = Math.max(0,d-1);
    txt += ` vs DC ${dc} → ${["Critical Failure","Failure","Success","Critical Success"][d]}`;
  }
  UI.secret = txt;
}

  }
  const c = getCreatureT(m.ref, m.tpl);

    return `<div class="pcc"><div class="pch"><input class="grow" data-set="enc|${d.id}|name" value="${esc(d.name)}">${chev(k, true)}</div><div class="pcb">
    <div class="small mut">${count}</div>
    ${d.members.map(m => memberRow(d,m)).join("") || '<p class="small mut">Empty. Add the party and creatures.</p>'}

function runSelect(){
  const e = curEnc(), opts = [], used = new Set();
  S.encs.forEach(d => { opts.push(["d:"+d.id, d.name]); S.runs.filter(r => r.src === d.id).forEach(r => { used.add(r.id); opts.push(["r:"+r.id, runLabel(r)]); }); });
  S.runs.filter(r => !used.has(r.id)).forEach(r => opts.push(["r:"+r.id, runLabel(r)]));
  return `<select data-act-change="pick-run"><option value="" ${e?"":"selected"} disabled>Select an encounter…</option>${opts.map(([v,l]) => `<option value="${v}" ${e && v==="r:"+e.id ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;

function setSR(d, size, rar){
  const cur = d.traits || [];
  const sz = size || SIZES.find(x => cur.includes(x)) || "";
  const rr = rar == null ? (RARITIES.find(x => cur.includes(x)) || "") : (rar === "Common" ? "" : rar);
  d.traits = (rr ? [rr] : []).concat(sz ? [sz] : [], cur.filter(t => !SIZES.includes(t) && !RARITIES.includes(t)));
}
function addTpl(d, i){
  const t = AB_TPL[i]; if(!t) return;
  const val = {};
  (t.ask || []).forEach(([k, q, def]) => { const r = prompt(q, def); val[k] = (r === null || !String(r).trim()) ? def : String(r).trim(); });
  const fill = s => s.replace(/\{(\w+)\}/g, (m, k) => val[k] != null ? val[k] : m);
  d.abilities.push({name:fill(t.n), action:t.a, cat:t.c, traits:t.t || "", text:fill(t.x)});
}
function composeDraft(d){
  const s = d.sx; if(!s) return;
  const sg = n => { n = parseFloat(n); if(isNaN(n)) n = 0; return (n >= 0 ? "+" : "") + n; };
  const join = (a, b, sep) => [a, b].filter(Boolean).join(sep);
  const sen = s.senses.map(x => (x.n + " " + (x.r || "")).trim()).join(", ");
  const per = (s.pm === "" || s.pm == null) ? sen : sg(s.pm) + (sen ? "; " + sen : "");
  d.perception = join(per, s.x.perception, "; ");
  d.languages = join(s.langs.join(", "), s.x.languages, ", ");
  d.skills = join(s.skills.map(k => k.n + " " + sg(k.m)).join(", "), s.x.skills, ", ");
  const def = [];
  if(s.imm.length) def.push("Immunities " + s.imm.join(", "));
  if(s.weak.length) def.push("Weaknesses " + s.weak.map(w => w.t + " " + (parseFloat(w.v) || 0)).join(", "));
  if(s.res.length) def.push("Resistances " + s.res.map(w => w.t + " " + (parseFloat(w.v) || 0)).join(", "));
  d.defenses = join(def.join("; "), s.x.defenses, "; ");
  const sp = [];
  if(s.land !== "" && s.land != null) sp.push((parseFloat(s.land) || 0) + " feet");
  s.speeds.forEach(x => sp.push(x.t.toLowerCase() + " " + (parseFloat(x.d) || 0) + " feet"));
  d.speed = join(sp.join(", "), s.x.speed, ", ");
  (d.attacks || []).forEach(a => { if(a.dmg) a.damage = join(join(a.dmg.d, a.dmg.t, " "), a.dmg.x, " "); });
}

/* ---------- backup, import, safety copies ---------- */
const APP_VERSION = "v38";   // keep in step with CACHE in sw.js
const META_KEY = "pf2gm.meta";
const getMeta = () => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } };
const setMeta = o => { try { localStorage.setItem(META_KEY, JSON.stringify(Object.assign(getMeta(), o))); } catch(e){} };
const hasUserData = () => !!(S.pcs.length || S.encs.length || S.custom.length || S.runs.length);
const counts = o => ({pcs:(o.pcs||[]).length, encs:(o.encs||[]).length, custom:(o.custom||[]).length});
const countText = c => `${c.pcs} PC${c.pcs===1?"":"s"} · ${c.encs} encounter${c.encs===1?"":"s"} · ${c.custom} custom creature${c.custom===1?"":"s"}`;
const dataOnly = () => ({pcs:S.pcs, encs:S.encs, runs:S.runs, custom:S.custom, run:S.run, settings:S.settings});
const backupData = () => Object.assign({app:"gm-tool", format:2, exported:new Date().toISOString()}, dataOnly());
const backupName = () => "gm-tool-backup-" + new Date().toISOString().slice(0,10);
const niceDate = iso => { try { return new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch(e){ return String(iso); } };

/* Inside the Android app (APK) downloads and Web Share don't exist, so the backup goes through the app's own file and share tools. */
const NATIVE = () => (typeof window !== "undefined" && window.GMNative) ? window.GMNative : null;
async function nativeBackup(share){
  const N = NATIVE(); if(!N) return false;
  try {
    const name = backupName() + ".json", text = JSON.stringify(backupData(), null, 2);
    const r = String(share ? N.shareBackup(name, text) : N.saveBackup(name, text));
    if(r.indexOf("error:") === 0){ alert("Couldn't save the backup: " + r.slice(6)); return true; }
    setMeta({lastFile:new Date().toISOString()});
    if(!share) openDlg(`<h2>Backup saved</h2><p>Saved <b>${esc(name)}</b> in your phone's <b>Downloads</b> folder.</p><p class="small mut">${esc(countText(counts(S)))}</p><div class="bar"><button class="pri" data-act="close">OK</button></div>`);
    if(UI.view === "menu") render();
  } catch(e){ alert("Couldn't save the backup: " + (e && e.message || e)); }
  return true;
}
async function saveBackupDownload(){
  if(await nativeBackup(false)) return;
  const name = backupName() + ".json";
  download(name, backupData());
  setMeta({lastFile:new Date().toISOString()});
  openDlg(`<h2>Backup saved</h2><p>Your phone saved <b>${esc(name)}</b> to its Downloads folder (or wherever Chrome's download setting points). Keep a copy somewhere safe, like Google Drive.</p><p class="small mut">${esc(countText(counts(S)))}</p><div class="bar"><button class="pri" data-act="close">OK</button></div>`);
  if(UI.view === "menu") render();
}
async function saveBackupShare(){
  if(await nativeBackup(true)) return;
  const text = JSON.stringify(backupData(), null, 2), base = backupName();
  try {
    let f = new File([text], base + ".json", {type:"application/json"});
    if(!(navigator.canShare && navigator.canShare({files:[f]}))) f = new File([text], base + ".txt", {type:"text/plain"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:"GM Tool backup"});
      setMeta({lastFile:new Date().toISOString()}); if(UI.view === "menu") render(); return;
    }
  } catch(e){ if(e && e.name === "AbortError") return; }      // the person closed the share sheet
  saveBackupDownload();                                           // sharing not available: save to Downloads instead
}

/* Automatic safety copies kept inside the app (IndexedDB), taken whenever the app is closed or hidden. */
const SNAPS = {
  open(){ return new Promise((res, rej) => { if(typeof indexedDB === "undefined") return rej(new Error("no idb")); const r = indexedDB.open("pf2gm", 1); r.onupgradeneeded = () => r.result.createObjectStore("snaps", {keyPath:"ts"}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all(){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("snaps").objectStore("snaps").getAll(); q.onsuccess = () => res(q.result.sort((a,b) => a.ts - b.ts)); q.onerror = () => rej(q.error); }); },
  async put(rec){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("snaps", "readwrite"); t.objectStore("snaps").put(rec); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(ts){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("snaps", "readwrite"); t.objectStore("snaps").delete(ts); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
async function snapshot(reason){
  try {
    if(!hasUserData()) return;
    const data = JSON.stringify(dataOnly()), all = await SNAPS.all();
    if(all.length && all[all.length-1].data === data) return;           // nothing changed since the last copy
    await SNAPS.put({ts:Date.now(), reason, data, n:counts(S)});
    for(const old of all.slice(0, Math.max(0, all.length + 1 - 5))) await SNAPS.del(old.ts);   // keep the newest 5
  } catch(e){}
}
function loadSnaps(){ SNAPS.all().then(a => { UI.snaps = a.reverse(); if(UI.view === "menu") render(); }).catch(() => { UI.snaps = []; if(UI.view === "menu") render(); }); }
async function restoreSnap(ts){
  let rec; try { rec = (await SNAPS.all()).find(x => x.ts === ts); } catch(e){}
  if(!rec) return;
  if(!confirm(`Replace everything with the safety copy from ${niceDate(rec.ts)}?\n${countText(rec.n)}`)) return;
  await snapshot("before restore");
  S = Object.assign({pcs:[], encs:[], runs:[], custom:[], run:null}, JSON.parse(rec.data)); migrate(); UI.open = {}; save(); loadSnaps(); render();
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") snapshot("closed"); });
if(window.addEventListener) window.addEventListener("pagehide", () => snapshot("closed"));

async function importText(text, fileName){
  let j; try { j = JSON.parse(text); } catch(e){ alert("That file isn't a GM Tool backup or creature file."); return; }
  const isBackup = j && !Array.isArray(j) && (j.pcs || j.encs || j.custom || j.runs);
  if(isBackup){
    const c = counts(j);
    if(!confirm(`Replace everything on this phone with this backup?\n${countText(c)}\n(A safety copy of what's here now is kept first.)`)) return;
    await snapshot("before import");
    S = {pcs:j.pcs||[], encs:j.encs||[], runs:j.runs||[], custom:j.custom||[], run:j.run||null, settings:j.settings||{}}; migrate(); UI.open = {};
    save(); render();
    openDlg(`<h2>Backup imported</h2><p>${esc(countText(counts(S)))}</p><div class="bar"><button class="pri" data-act="close">OK</button></div>`);
    return;
  }
  const arr = Array.isArray(j) ? j : (j && j.creatures ? j.creatures : (j && j.name ? [j] : []));
  if(!arr.length){ alert("That file has no PCs, encounters or creatures I recognize."); return; }

async function checkUpdate(){
  UI.upd = {busy:true}; if(UI.view === "menu") render();
  const r = {};
  try {
    const res = await fetch("sw.js?cb=" + Date.now(), {cache:"no-store", credentials:"same-origin"});
    r.status = res.status;
    const t = await res.text(), m = t.match(/pf2gm-v(\d+)/);
    if(res.ok && m) r.server = "v" + m[1];
    else if(res.ok) r.err = "The server sent a page that isn't the app, most likely the access-code screen. Open your app link in the browser and enter your code.";
    else r.err = "The server answered with error " + res.status + (res.status === 404 ? ": the app files weren't found. Check the repo name, branch and token settings in Cloudflare." : res.status === 401 || res.status === 403 ? ": access refused. Check the GitHub token in Cloudflare." : ".");
  } catch(e){ r.err = "Couldn't reach the server (offline or blocked): " + (e && e.message || e); }
  try { const g = await navigator.serviceWorker.getRegistrations(); r.sw = g.length ? (g[0].active ? "active" : "installing") + (g[0].waiting ? ", update waiting" : "") : "not installed"; } catch(e){ r.sw = "unavailable"; }
  UI.upd = r; if(UI.view === "menu") render();
}
async function updateNow(){
  try { const g = await navigator.serviceWorker.getRegistrations(); for(const x of g) await x.unregister(); } catch(e){}
  try { const k = await caches.keys(); for(const x of k) await caches.delete(x); } catch(e){}
  location.replace(location.pathname + "?u=" + Date.now());      // your saved PCs, encounters and creatures are not touched
}

function setPath(o, path, val){

}
function root(r, id){
  if(r==="pc") return S.pcs.find(p=>p.id===id);

    case "start-ok": applyStart(id); return;
    case "rec": { const c = findCB(id); const msg = recover(c, +el.dataset.g); save(); render(); startDialog(id, msg); return; }
    case "rec-roll": { const c = findCB(id); const dc = 10 + c.dying, r = d20(), deg = degreeOf(r, dc); const msg = `Rolled ${r} vs DC ${dc}: ${DEG[deg]}. ` + recover(c, deg); save(); render(); startDialog(id, msg); return; }
    case "z-remove": { const i = e.list.findIndex(x => x.id === id); if(i >= 0){ const [c] = e.list.splice(i,1); e.out = e.out || []; e.out.push(c); } save(); afterZero(); return; }
    case "z-unc": addCond(findCB(id), "Unconscious"); save(); afterZero(); return;
    case "z-dying": dyingDialog(id, true); return;
    case "z-back": zeroDialog(id, UI.zprev); return;
    case "z-undo": { ev.preventDefault(); const c = findCB(id); c.hp = Math.min(c.max || 9999, UI.zprev || 1); save(); afterZero(); return; }
    case "restore": { const k = (e.out||[]).findIndex(x => x.id === id); if(k >= 0){ e.list.push(e.out.splice(k,1)[0]); } save(); break; }
    case "sheet": { const p = S.pcs.find(x => x.id === id); if(p) openDlg(pcSheetHTML(p) + '<div class="bar"><button data-act="close-sheet">Close</button></div>'); return; }
    case "edit-pc": closeDlg(); UI.view = "party"; break;
    case "prev": nextTurn(-1); break;
    case "turn-to": e.active = id; save(); break;
    case "add-pcs": addPartyMembers(id); render(); pcPicker(id); return;
    case "add-pc-dlg": pcPicker(id); return;
    case "add-pc-one": { const d = S.encs.find(x=>x.id===el.dataset.enc); if(d && !d.members.some(m=>m.kind==="pc"&&m.ref===id)){ d.members.push({id:uid(), kind:"pc", ref:id, tpl:"", qty:1}); save(); } render(); pcPicker(el.dataset.enc); return; }
    case "add-cr": UI.buildId = id; pickerDialog(); return;
    case "add-pick": addMember(UI.buildId, id, Math.max(1,parseInt($("#pqty").value,10)||1), $("#ptpl").value); el.querySelector("span.mut").textContent = "added ✓"; render(); return;
    case "add-to": { let tg = $("#tgt").value; if(tg === "__new"){ const n = prompt("Encounter name?", "New Encounter"); if(n === null) return; tg = newEnc(n || "New Encounter").id; } addMember(tg, id, Math.max(1,parseInt($("#qty").value,10)||1), $("#tpl").value); UI.buildId = tg; closeDlg(); UI.view = "enc"; break; }
    case "up": moveCB(id,-1); break;
    case "down": moveCB(id,1); break;
    case "delay": delayCB(id); break;
    case "return": returnCB(id); break;
    case "drop": dyingDialog(id); return;
    case "dying-ok": applyDying(id); return;
    case "dmg-apply": {
      const c = findCB(id); if(!c) return;
      const r = calcRows(c, dmState(id).rows);
      if(!r.lines.length) return;
      if(r.adj){ dmgDialog(id, r); return; }
      dealDamage(id, r.total); return;
    }
    case "dmg-go": { const v = parseInt(($("#dfinal") || {}).value, 10) || 0; closeDlg(); dealDamage(id, v); return; }
    case "dmg-row": dmState(id).rows.push({amt:"", types:[]}); break;
    case "dmg-rowx": { const st = dmState(id); st.rows.splice(+el.dataset.i, 1); if(!st.rows.length) st.rows.push({amt:"", types:[]}); break; }
    case "dmg-heal": {
      const c = findCB(id); if(!c) return;
      const amt = dmState(id).rows.reduce((s, r) => s + (parseInt(r.amt, 10) || 0), 0); if(!amt) return;
      UI.hit[id] = +c.hp || 0; c.hp = (+c.hp || 0) + amt; if(c.hp > 0 && c.dying) c.dying = 0;
      dmReset(id); break;
    }
    case "dmg-undo": { const c = findCB(id); if(!c || UI.hit[id] == null) return; c.hp = UI.hit[id]; UI.hit[id] = null; break; }
    case "hp-set": {
      const c = findCB(id); if(!c) return;
      const v = prompt("Current HP for " + c.name + "?", c.hp); if(v === null) return;
      const n = parseInt(v, 10); if(isNaN(n) || n < 0) return;
      const old = +c.hp || 0; c.hp = n; if(n > 0 && c.dying) c.dying = 0; UI.hit[id] = old; save(); render();
      if(old > 0 && n <= 0 && !(c.dying > 0)) zeroDialog(id, old); return;
    }
    case "set-hpmode": S.settings.hpMode = el.dataset.v === "damage" ? "damage" : "slider"; break;
    case "set-trackpc": { const on = el.dataset.v === "on"; S.settings.trackPcDefault = on; S.pcs.forEach(p => { p.trackHp = on; }); break; }
    case "dy-heal": { const c = findCB(id); if(!c) return; if(tracksHp(c)){ healDialog(id); return; } dyHeal(c, 1); break; }
    case "dy-heal-ok": { const c = findCB(id); if(!c) return; const inp = $("#rhamt"); const msg = dyHeal(c, inp ? inp.value : 1); save(); render(); if(el.dataset.from === "start") startDialog(id, msg); else closeDlg(); return; }
    case "dy-stab": { const c = findCB(id); if(!c) return; const msg = dyStab(c); save(); render(); if(el.dataset.from === "start") startDialog(id, msg); return; }
    case "dy": { const c = findCB(id); c.dying = Math.max(0, c.dying + (+el.dataset.d)); if(c.dying===0 && +el.dataset.d<0){ c.wounded = (c.wounded||0)+1; } save(); break; }
    case "hp": {
      const c = findCB(id); const old = +c.hp || 0;
      c.hp = Math.max(0, old + (+el.dataset.d));   // never below 0; may go above Max HP to track temporary HP
      if(c.hp > 0 && c.dying){ c.dying = 0; }
      save();
      if(old > 0 && c.hp <= 0 && !(c.dying > 0)){ render(); zeroDialog(id, old); return; }
      break;
    }
    case "rm": if(!confirm("Remove from encounter?")) return; e.list = e.list.filter(c=>c.id!==id); if(e.active===id) e.active = e.list[0]?e.list[0].id:null; save(); break;
    case "show": showCard(id, el.dataset.tpl || "", UI.view === "combat"); return;
    case "new-pc": newPC(); break;
    case "del-pc": if(!confirm("Delete this PC?")) return; S.pcs = S.pcs.filter(p=>p.id!==id); save(); break;
    case "add-lore": S.pcs.find(p=>p.id===id).lores.push({name:"",item:0,prof:"T"}); save(); break;
    case "secret": secretRoll(id, el.dataset.skill); if(document.querySelectorAll) document.querySelectorAll(".secret-out").forEach(n => { n.innerHTML = `<div class="banner">${esc(UI.secret)}</div>`; }); break;
    case "new-cr": UI.draft = blankDraft(); UI.view="create"; break;
    case "edit-cr": { UI.draft = JSON.parse(JSON.stringify(getCreature(id))); if(!UI.draft.sx) UI.draft.sx = legacySx(UI.draft); UI.draft._edit = true; UI.view="create"; closeDlg(); break; }
    case "del-cr": if(!confirm("Delete this custom creature?")) return; S.custom = S.custom.filter(c=>c.id!==id); save(); closeDlg(); break;
    case "add-att": UI.draft.attacks.push({type:"Melee",action:"1",name:"",bonus:"",traits:"",damage:"",dmg:{d:"",t:"",x:""}}); break;
    case "cr-tog": { const a = arrAt(UI.draft, el.dataset.k), v = el.dataset.v, i = a.indexOf(v); if(i >= 0) a.splice(i, 1); else a.push(v); break; }
    case "cr-size": setSR(UI.draft, el.dataset.v, null); break;
    case "cr-rar": setSR(UI.draft, null, el.dataset.v); break;
    case "cr-sense": { const a = UI.draft.sx.senses, i = a.findIndex(x => x.n === el.dataset.v); if(i >= 0) a.splice(i, 1); else a.push({n:el.dataset.v, r:""}); break; }
    case "cr-other": { const n = prompt(el.dataset.q || "Name?", ""); if(!n || !n.trim()) return; const a = arrAt(UI.draft, el.dataset.k), t = n.trim(); if(el.dataset.k === "sx.senses"){ if(!a.some(x => x.n === t)) a.push({n:t, r:""}); } else if(!a.includes(t)) a.push(t); break; }
    case "cr-rm": arrAt(UI.draft, el.dataset.k).splice(+el.dataset.i, 1); break;
    case "cr-atrait": { const a = UI.draft.attacks[+el.dataset.i], l = (a.traits || "").split(",").map(s => s.trim()).filter(Boolean), j = l.indexOf(el.dataset.v); if(j >= 0) l.splice(j, 1); else l.push(el.dataset.v); a.traits = l.join(", "); break; }
    case "rm-att": UI.draft.attacks.splice(+el.dataset.i,1); break;
    case "add-abl": UI.draft.abilities.push({name:"",action:"passive",text:""}); break;
    case "rm-abl": UI.draft.abilities.splice(+el.dataset.i,1); break;
    case "cancel-cr": UI.draft=null; UI.view="bestiary"; break;
    case "save-cr": {
      const d = UI.draft; if(!d.name.trim()){ alert("Give the creature a name."); return; }
      composeDraft(d);
      const out = JSON.parse(JSON.stringify(d)); delete out._edit; out.custom = true;
      const i = S.custom.findIndex(c=>c.id===out.id); if(i>=0) S.custom[i]=out; else S.custom.push(out);
      save(); UI.draft=null; UI.view="bestiary"; break;
    }
    case "valpick": {
      const p = S.pcs.find(x=>x.id===id); if(!p) return;
      const path = el.dataset.path, cur = +path.split(".").reduce((o,k)=>o[k], p) || 0;
      const vals = el.dataset.kind === "stat" ? [-2,-1,0,1,2,3,4,5,6,7] : [0,1,2,3,4,5,6,7];
      openDlg(`<h2>${esc(el.dataset.label||"Bonus")}</h2><div class="g" style="grid-template-columns:repeat(${vals.length>8?5:4},1fr)">${vals.map(v=>`<button class="${v===cur?"pri":""}" style="min-height:48px;font-size:18px" data-act="valset" data-id="${p.id}" data-path="${esc(path)}" data-v="${v}">${sgn(v)}</button>`).join("")}</div><div class="bar" style="margin-top:8px"><button data-act="close">Cancel</button></div>`);
      return; }
    case "valset": { const p = S.pcs.find(x=>x.id===id); if(!p) return; setPath(p, el.dataset.path, +el.dataset.v); save(); closeDlg(); break; }
  }
  render();
}
$("#file").addEventListener("change", ev => {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => importText(String(r.result), f.name);
  r.readAsText(f); ev.target.value = "";
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
setTimeout(startupPrompts, 500);

/* Back-button guard: one extra history entry absorbs the first Back press and asks before leaving. */
let trap = false;
function armTrap(){ if(trap || typeof history === "undefined") return; try { history.pushState({gm:1}, "", location.href); trap = true; } catch(e){} }
if(window.addEventListener) window.addEventListener("popstate", () => {
  if(!trap) return;
  trap = false;                                   // that Back press used up the guard entry
  if($("#dlg2").open){ $("#dlg2").close(); return; }
  if(dlg.open){ closeDlg(); return; }             // Back closes an open popup first
  openDlg(`<h2>Leave GM Tool?</h2><p>Your data is saved. Press Stay to keep working.</p><div class="bar"><button class="pri lg" data-act="stay">Stay</button><button class="lg" data-act="leave">Leave</button></div>`);
});
document.addEventListener("pointerdown", armTrap, true);   // browsers only keep history entries made after a tap
armTrap();
</script>
</body>
</html>
